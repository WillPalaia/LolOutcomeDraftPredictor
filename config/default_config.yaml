data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
  years: [2022, 2023, 2024, 2025]
  gdrive_file_ids:
    2021: "1fzwTTz77hcnYjOnO9ONeoPrkWCoOSecA"
    2022: "1EHmptHyzY8owv0BAcNKtkQpMwfkURwRy"
    2023: "1XXk2LO0CsNADBB1LRGOV5rUpyZdEZ8s2"
    2024: "1IjIEhLc9n8eLKeY-yh_YigKVWbhgGBsN"
    2025: "1v6LRphp2kYciU4SXp0PCjEMuev1bDejc"
  target_leagues:
    - "LCK"
    - "LPL"
    - "LEC"
    - "LCS"
    - "WLDs"
    - "MSI"
    - "PCS"
    - "VCS"
    - "CBLOL"
    - "LJL"
    - "EWC"
  include_all_leagues: true

ratings:
  initial_rating: 1500.0
  initial_rd: 200.0
  volatility: 0.06
  tau: 0.5
  side_bias_elo: 35.0  # ~55% Blue side baseline win rate

features:
  bayesian_prior_matches: 20.0
  bayesian_prior_winrate: 0.50
  patch_decay_halflife_days: 21.0
  min_champion_games_mastery: 5

models:
  primary: "catboost"
  catboost:
    iterations: 800
    learning_rate: 0.03
    depth: 6
    l2_leaf_reg: 4.0
    random_seed: 42
    early_stopping_rounds: 50
  lightgbm:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 31
    reg_alpha: 1.0
    reg_lambda: 3.0
    random_state: 42
  xgboost:
    n_estimators: 800
    learning_rate: 0.03
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  neural:
    embedding_dim: 32
    hidden_dim: 128
    dropout: 0.25
    learning_rate: 0.001
    epochs: 40
    batch_size: 64

backtest:
  min_train_games: 4000
  test_split_ratio: 0.2
  expanding_window: true
  market_vig: 0.04           # 4% bookmaker overround
  ev_threshold: 0.03         # Minimum 3% EV to place trade
  kelly_fraction: 0.25       # Quarter-Kelly criterion
  initial_bankroll: 10000.0  # $10,000 baseline
  max_bet_fraction: 0.05     # Cap individual bets at 5% bankroll
