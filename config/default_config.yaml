data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
  years: [2024]
  gdrive_file_ids:
    2021: "1fzwTTz77hcnYjOnO9ONeoPrkWCoOSecA"
    2022: "1EHmptHyzY8owv0BAcNKtkQpMwfkURwRy"
    2023: "1XXk2LO0CsNADBB1LRGOV5rUpyZdEZ8s2"
    2024: "1IjIEhLc9n8eLKeY-yh_YigKVWbhgGBsN"
    2025: "1v6LRphp2kYciU4SXp0PCjEMuev1bDejc"
  target_leagues:
    - "LCK"
    - "LPL"
    - "LEC"
    - "LCS"
    - "WLDs"
    - "MSI"
    - "PCS"
    - "VCS"
    - "CBLOL"
    - "LJL"
    - "EWC"
  include_all_leagues: true

ratings:
  initial_rating: 1500.0
  initial_rd: 200.0
  volatility: 0.06
  tau: 0.5
  side_bias_elo: 35.0  # ~55% Blue side baseline win rate

features:
  bayesian_prior_matches: 15.0
  bayesian_prior_winrate: 0.50
  patch_decay_halflife_days: 21.0
  min_champion_games_mastery: 5

models:
  primary: "catboost"
  catboost:
    iterations: 350
    learning_rate: 0.02
    depth: 4
    l2_leaf_reg: 8.0
    random_seed: 42
    early_stopping_rounds: 40

backtest:
  min_train_games: 4000
  test_split_ratio: 0.2
  expanding_window: true
  market_vig: 0.035          # 3.5% bookmaker overround
  ev_threshold: 0.025        # Minimum 2.5% EV to place trade
  kelly_fraction: 0.20       # 1/5th Kelly criterion
  initial_bankroll: 10000.0  # $10,000 baseline
  max_bet_fraction: 0.035    # Cap individual bets at 3.5% bankroll

